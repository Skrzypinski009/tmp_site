<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Buy Now Pay Later — Bikes</title>
<style>
  :root{
    --ink:#101820;
    --ink-soft:#2a343d;
    --paper:#EFF1EE;
    --paper-card:#ffffff;
    --accent:#FF5A1F;
    --line: rgba(16,24,32,0.10);
    --tint-1:#E7ECF3;
    --tint-2:#F7E6DD;
    --tint-3:#E4F1EA;
    --tint-4:#F2E8F5;
    --tint-5:#FDEFD9;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior-y: none;
  }
  body{ padding-bottom: calc(24px + var(--safe-b)); }
  button{ font-family:inherit; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    background:var(--ink);
    color:var(--paper);
    padding: calc(14px + var(--safe-t)) 18px 16px;
    display:grid;
    grid-template-columns: 44px 1fr 44px;
    align-items:center;
    box-shadow: 0 8px 24px rgba(16,24,32,0.18);
  }
  .brand{
    grid-column: 2;
    font-weight:800;
    font-size: 18px;
    letter-spacing:-0.02em;
    line-height:1.2;
    text-align:center;
  }
  .brand .accent{ color: var(--accent); }
  .cart-btn{
    grid-column: 3;
    justify-self:end;
    position:relative;
    width:44px; height:44px;
    border-radius:14px;
    border:1px solid rgba(239,241,238,0.18);
    background: rgba(239,241,238,0.08);
    display:flex; align-items:center; justify-content:center;
    color:var(--paper);
    transition: transform .15s ease, background .15s ease;
  }
  .cart-btn:active{ transform: scale(0.92); background: rgba(239,241,238,0.18); }
  .cart-btn svg{ width:22px; height:22px; }
  .cart-badge{
    position:absolute; top:-6px; right:-6px;
    min-width:20px; height:20px; padding:0 5px;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--ink);
    transform: scale(0);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .cart-badge.show{ transform: scale(1); }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:12px;
    padding: calc(94px + var(--safe-t)) 18px 18px;
  }
  .tile{
    position:relative;
    border-radius: 22px;
    padding: 14px 14px 16px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    cursor:pointer;
    transition: box-shadow .2s ease, transform .12s ease, border-color .2s ease;
    -webkit-user-select:none; user-select:none;
  }
  .tile:active{ transform: scale(0.985); }
  .tile.selected{
    border-color: var(--ink);
    box-shadow: 0 10px 30px rgba(16,24,32,0.14);
  }
  .tile[data-tint="1"] .img-wrap{ background: var(--tint-1); }
  .tile[data-tint="2"] .img-wrap{ background: var(--tint-2); }
  .tile[data-tint="3"] .img-wrap{ background: var(--tint-3); }
  .tile[data-tint="4"] .img-wrap{ background: var(--tint-4); }
  .tile[data-tint="5"] .img-wrap{ background: var(--tint-5); }

  .img-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 3;
    border-radius:16px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:12px;
  }
  .tile.selected .img-wrap{ aspect-ratio: 16/9; }
  .img-wrap img{
    width:100%; height:100%; object-fit:contain; display:block;
  }
  .img-wrap svg{ width:66%; height:66%; }
  .tile.selected .img-wrap svg{ width:38%; height:38%; }

  .name{
    margin-top:10px;
    font-size:14.5px; font-weight:700; letter-spacing:-0.01em; line-height:1.25;
    text-align:center;
  }

  /* ---------- SLIDER PANEL (inside selected tile) ---------- */
  .plan{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition: max-height .28s ease, opacity .22s ease, margin-top .28s ease;
  }
  .tile.selected .plan{
    max-height:100px;
    opacity:1;
    margin-top:14px;
  }
  .plan-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .plan-label{ font-size:12.5px; color: var(--ink-soft); font-weight:600; }
  .plan-value{
    font-size:13px; font-weight:800;
    background: var(--ink); color:var(--paper);
    padding:4px 10px; border-radius:999px;
  }
  .plan-value b{ color: var(--accent); }

  input[type="range"].months{
    -webkit-appearance:none; appearance:none;
    width:100%; height:34px;
    background:transparent;
    margin:0;
  }
  input[type="range"].months::-webkit-slider-runnable-track{
    height:6px; border-radius:3px;
    background: linear-gradient(to right, var(--ink) 0%, var(--ink) var(--fill,50%), rgba(16,24,32,0.14) var(--fill,50%), rgba(16,24,32,0.14) 100%);
  }
  input[type="range"].months::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px; height:26px; margin-top:-10px;
    border-radius:50%;
    background: var(--accent);
    border:3px solid #fff;
    box-shadow: 0 2px 8px rgba(16,24,32,0.3);
  }
  .plan-scale{
    display:flex; justify-content:space-between;
    font-size:10.5px; color: rgba(16,24,32,0.4);
    margin-top:-4px;
  }

  /* ---------- CART SHEET ---------- */
  .scrim{
    position:fixed; inset:0;
    background: rgba(16,24,32,0.42);
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
    z-index:30;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    z-index:31;
    background: var(--paper-card);
    border-radius: 26px 26px 0 0;
    padding: 10px 18px calc(20px + var(--safe-b));
    max-height: 78vh;
    display:flex; flex-direction:column;
    transform: translateY(102%);
    transition: transform .32s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 -10px 40px rgba(16,24,32,0.25);
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{
    width:38px; height:4px; border-radius:2px;
    background: rgba(16,24,32,0.15);
    margin: 6px auto 16px;
  }
  .sheet-list{ overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; padding-bottom:4px; }
  .cart-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .cart-item:last-child{ border-bottom:none; }
  .cart-thumb{
    width:56px; height:56px; border-radius:14px;
    flex:0 0 auto;
    padding:6px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .cart-thumb img{ width:100%; height:100%; object-fit:contain; }
  .cart-thumb svg{ width:60%; height:60%; }
  .cart-info{ flex:1; min-width:0; }
  .cart-name{ font-size:14px; font-weight:700; letter-spacing:-0.01em; }
  .cart-term{ font-size:12.5px; color: var(--ink-soft); margin-top:2px; }

  .continue-btn{
    margin-top:16px;
    width:100%; border:none; border-radius:16px;
    padding:16px;
    background: var(--ink);
    color: var(--paper);
    font-size:15.5px; font-weight:800; letter-spacing:-0.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s ease, background .15s ease;
  }
  .continue-btn:active{ transform: scale(0.98); background:#000; }

  /* ---------- CHECKOUT / TRUCK OVERLAY ---------- */
  .checkout-overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background: rgba(16,24,32,0.35);
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    opacity:0; pointer-events:none;
    transition: opacity .35s ease;
  }
  .checkout-overlay.open{ opacity:1; pointer-events:auto; }

  .road{
    position:relative;
    width: calc(100% - 48px);
    max-width: 360px;
    height:110px;
    overflow:hidden;
  }
  .road-line{
    position:absolute; left:0; right:0; bottom:30px;
    height:2px;
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.6) 0 18px, transparent 18px 34px);
    animation: roadmove 0.5s linear infinite;
  }
  @keyframes roadmove{
    from{ background-position-x: 0; }
    to{ background-position-x: -34px; }
  }
  .truck{
    position:absolute; bottom:14px; left:-20%;
    font-size:64px;
    line-height:1;
    animation: drive 2.6s linear infinite;
  }
  @keyframes drive{
    0%{ left:-20%; transform: scaleX(-1); }
    100%{ left: 110%; transform: scaleX(-1); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      BUY NOW<br>
      <span class="accent">PAY LATER</span>
    </div>
    <button class="cart-btn" id="cartBtn" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="19" cy="21" r="1.4" fill="currentColor" stroke="none"/>
        <path d="M2.5 3h2.2l2.3 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21.5 7H6"/>
      </svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-list" id="sheetList"></div>
    <button class="continue-btn" id="continueBtn">Continue</button>
  </div>

  <div class="checkout-overlay" id="checkoutOverlay">
    <div class="road">
      <div class="road-line"></div>
      <div class="truck" id="truckSvg">🚚</div>
    </div>
  </div>

<script>
(function(){

  var PRODUCTS = [
    { id:1, name:"Commuter Classic", tint:1, color:"#3E5C8A", accent:"#22314B" },
    { id:2, name:"Trail Blazer",     tint:2, color:"#D9622B", accent:"#7A2E10" },
    { id:3, name:"City Fold",        tint:3, color:"#2F8F63", accent:"#1B5138" },
    { id:4, name:"Gravel Pro",       tint:4, color:"#8C5FB0", accent:"#4E2F66" },
    { id:5, name:"Cruiser Breeze",   tint:5, color:"#D6A429", accent:"#7A5C10" }
  ];

  var cart = {}; // id -> months

  function bikeSVG(p){
    return '<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="26" cy="56" r="18" fill="none" stroke="'+p.color+'" stroke-width="4"/>' +
      '<circle cx="88" cy="56" r="18" fill="none" stroke="'+p.color+'" stroke-width="4"/>' +
      '<circle cx="26" cy="56" r="2.4" fill="'+p.accent+'"/>' +
      '<circle cx="88" cy="56" r="2.4" fill="'+p.accent+'"/>' +
      '<path d="M26 56 L52 24 L70 24 M26 56 L58 56 L88 56 M58 56 L46 32 M70 24 L88 56" ' +
      'fill="none" stroke="'+p.accent+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M46 32 h14" stroke="'+p.accent+'" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="M70 18 l6 6 M70 24 v-8" stroke="'+p.accent+'" stroke-width="4" stroke-linecap="round"/>' +
      '</svg>';
  }

  var grid = document.getElementById('grid');

  PRODUCTS.forEach(function(p){
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.tint = p.tint;
    tile.dataset.id = p.id;

    tile.innerHTML =
      '<div class="img-wrap">' +
        '<img src="../img/bikes2/bike'+p.id+'.png" alt="'+p.name+'" ' +
          'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
        '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:absolute;inset:0;">' + bikeSVG(p) + '</div>' +
      '</div>' +
      '<div class="name">'+p.name+'</div>' +
      '<div class="plan">' +
        '<div class="plan-row">' +
          '<span class="plan-label">Payment term</span>' +
          '<span class="plan-value"><b id="mVal-'+p.id+'">8</b> mo</span>' +
        '</div>' +
        '<input class="months" id="range-'+p.id+'" type="range" min="4" max="14" value="8" step="1">' +
        '<div class="plan-scale"><span>4</span><span>14</span></div>' +
      '</div>';

    grid.appendChild(tile);

    tile.addEventListener('click', function(e){
      if (e.target.closest('.plan')) return;
      toggleSelect(p);
    });

    var range = tile.querySelector('#range-'+p.id);
    range.addEventListener('click', function(e){ e.stopPropagation(); });
    range.addEventListener('input', function(){
      updateSliderVisual(range);
      cart[p.id] = parseInt(range.value, 10);
      document.getElementById('mVal-'+p.id).textContent = range.value;
    });
    updateSliderVisual(range);
  });

  function updateSliderVisual(range){
    var min = +range.min, max = +range.max, val = +range.value;
    var pct = ((val - min) / (max - min)) * 100;
    range.style.setProperty('--fill', pct + '%');
  }

  function toggleSelect(p){
    var tile = grid.querySelector('.tile[data-id="'+p.id+'"]');
    var selected = tile.classList.toggle('selected');
    if (selected){
      cart[p.id] = parseInt(document.getElementById('range-'+p.id).value, 10);
    } else {
      delete cart[p.id];
    }
    updateCartBadge();
  }

  function cartCount(){ return Object.keys(cart).length; }

  function updateCartBadge(){
    var badge = document.getElementById('cartBadge');
    var count = cartCount();
    badge.textContent = count;
    badge.classList.toggle('show', count > 0);
  }

  // ---------- CART SHEET ----------
  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('sheet');
  var sheetList = document.getElementById('sheetList');

  function renderSheet(){
    sheetList.innerHTML = '';
    PRODUCTS.forEach(function(p){
      if (!(p.id in cart)) return;
      var months = cart[p.id];
      var row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML =
        '<div class="cart-thumb" style="background:var(--tint-'+p.tint+')">' +
          '<img src="../img/bikes2/bike'+p.id+'.png" alt="" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
          '<div style="display:none;align-items:center;justify-content:center;width:100%;height:100%;">' + bikeSVG(p) + '</div>' +
        '</div>' +
        '<div class="cart-info">' +
          '<div class="cart-name">'+p.name+'</div>' +
          '<div class="cart-term">'+months+' mo payment term</div>' +
        '</div>';
      sheetList.appendChild(row);
    });
  }

  function openSheet(){
    renderSheet();
    scrim.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet(){
    scrim.classList.remove('open');
    sheet.classList.remove('open');
  }

  document.getElementById('cartBtn').addEventListener('click', function(){
    if (cartCount() === 0) return;
    if (sheet.classList.contains('open')){ closeSheet(); return; }
    openSheet();
  });
  scrim.addEventListener('click', closeSheet);

  // ---------- CHECKOUT ----------
  var overlay = document.getElementById('checkoutOverlay');
  var truck = document.getElementById('truckSvg');

  document.getElementById('continueBtn').addEventListener('click', function(){
    if (cartCount() === 0) return;
    closeSheet();
    setTimeout(startCheckout, 200);
  });

  function startCheckout(){
    truck.style.animation = 'none';
    void truck.offsetWidth; // restart animation
    truck.style.animation = '';
    overlay.classList.add('open');
  }

  overlay.addEventListener('click', function(){
    overlay.classList.remove('open');
  });

})();
</script>
</body>
</html>
